services:
  catalog-db:
    image: postgres:17-alpine
    container_name: shopmicro-catalog-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catalogdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-catalogdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - shopmicro-network

  catalog-api:
    image: shopmicro-catalog-api
    container_name: shopmicro-catalog-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/Catalog.Api/Dockerfile
    ports:
      - "${CATALOG_PORT:-5001}:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_HTTP_PORTS=5001
      - ConnectionStrings__CatalogDb=Host=catalog-db;Port=5432;Database=${POSTGRES_DB:-catalogdb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
    depends_on:
      catalog-db:
        condition: service_healthy
    networks:
      - shopmicro-network

networks:
  shopmicro-network:
    name: shopmicro-network
    driver: bridge

volumes:
  catalog-db-data:
    name: shopmicro-catalog-db-data
