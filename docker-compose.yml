services:
  catalog-db:
    image: postgres:17-alpine
    container_name: shopmicro-catalog-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catalogdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-catalogdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - shopmicro-network

  catalog-api:
    image: shopmicro-catalog-api
    container_name: shopmicro-catalog-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/Catalog.Api/Dockerfile
    ports:
      - "${CATALOG_PORT:-5001}:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_HTTP_PORTS=5001
      - ConnectionStrings__CatalogDb=Host=catalog-db;Port=5432;Database=${POSTGRES_DB:-catalogdb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      catalog-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shopmicro-network

  order-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: shopmicro-order-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Password123!}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - order-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-Password123!}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-Password123!}\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - shopmicro-network

  redis:
    image: redis:7-alpine
    container_name: shopmicro-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - shopmicro-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: shopmicro-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - shopmicro-network

networks:
  shopmicro-network:
    name: shopmicro-network
    driver: bridge

volumes:
  catalog-db-data:
    name: shopmicro-catalog-db-data
  order-db-data:
    name: shopmicro-order-db-data
  redis-data:
    name: shopmicro-redis-data
  rabbitmq-data:
    name: shopmicro-rabbitmq-data
