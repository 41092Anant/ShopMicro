services:
  catalog-db:
    image: postgres:17-alpine
    container_name: shopmicro-catalog-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: catalogdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalogdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - shopmicro-network

  catalog-api:
    image: shopmicro-catalog-api
    container_name: shopmicro-catalog-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/Catalog.Api/Dockerfile
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5001
      - ConnectionStrings__CatalogDb=Host=catalog-db;Port=5432;Database=catalogdb;Username=postgres;Password=postgres
    depends_on:
      catalog-db:
        condition: service_healthy
    networks:
      - shopmicro-network

networks:
  shopmicro-network:
    name: shopmicro-network
    driver: bridge

volumes:
  catalog-db-data:
    name: shopmicro-catalog-db-data
