name: ShopMicro CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: Build & Test (.NET 10 LTS)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 3. Verify .NET SDK version
        run: dotnet --version

      - name: 4. Restore dependencies
        run: dotnet restore ShopMicro.sln

      - name: 5. Build solution
        run: dotnet build ShopMicro.sln --no-restore --configuration Release

      - name: 6. Execute unit tests
        run: dotnet test ShopMicro.sln --no-build --configuration Release --logger "console;verbosity=normal"
